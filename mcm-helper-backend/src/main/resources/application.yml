      embedding-model:
        model-name: text-embedding-v2
        api-key: ${DASHSCOPE_API_KEY:your-api-key-here}
      streaming-model:
        model-name: qwen-max
        api-key: ${DASHSCOPE_API_KEY:your-api-key-here}
server:
  port: 8084

