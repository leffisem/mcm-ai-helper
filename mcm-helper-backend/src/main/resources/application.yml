spring:
  application:
    name: mcm-helper
  profiles:
    active: local
  webflux:
    base-path: /api
modelScope:
    mcp:
     url: "https://mcp.api-inference.modelscope.net/fb627860e0b84b/sse"      # 替换成你的 Remote URL
langchain4j:
  community:
    dashscope:
      chat-model:
        model-name: qwen-max
